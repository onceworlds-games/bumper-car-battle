<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Carnevale</title>
    <link rel="icon" href="data:," />
    <style>
      /* Painted before any script runs: the dusk and the name, until the plaza behind it is ready. */
      html, body { margin: 0; height: 100%; background: #12263a; }
      #boot {
        position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: flex-start;
        padding: clamp(36px, 11vh, 120px) 16px 96px; box-sizing: border-box; transition: opacity 0.6s ease;
        background: radial-gradient(ellipse at 50% 108%, #f6b46e 0%, #e0795a 26%, #7d4a5a 52%, #1b3b52 78%, #12263a 100%);
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot h1 {
        margin: 0; font: italic 700 clamp(56px, 13vw, 132px) / 0.9 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
        color: #f1e3c8; letter-spacing: -0.01em; text-shadow: 0 4px 0 rgba(26, 20, 20, 0.45), 0 0 40px rgba(242, 181, 68, 0.35);
      }
      @media (max-height: 520px) and (min-aspect-ratio: 4/3) { #boot h1 { font-size: clamp(48px, 16vh, 96px); } }
    </style>
  </head>
  <body>
    <div id="boot"><h1>Carnevale</h1></div>
    <canvas id="scene" aria-label="The plaza"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
